[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-multifactor"
version = "0.1.0"
description = "Auditable A-share multifactor research and walk-forward backtesting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.1,<3", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ashare = "ashare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
